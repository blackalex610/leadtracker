name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadtracker
          POSTGRES_PASSWORD: leadtracker
          POSTGRES_DB: leadtracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadtracker" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://leadtracker:leadtracker@localhost:5432/leadtracker_test
      DATABASE_URL: postgresql+asyncpg://leadtracker:leadtracker@localhost:5432/leadtracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @leadtracker/shared typecheck
      - run: pnpm --filter @leadtracker/web lint
      - run: pnpm --filter @leadtracker/web typecheck
      - run: pnpm --filter @leadtracker/web test
      - run: pnpm --filter @leadtracker/web build

  api-types:
    name: Generated API types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cd apps/api && uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: git diff --exit-code packages/shared || (echo "Run 'pnpm gen:api' and commit the result" && exit 1)

  e2e:
    name: End-to-end (Playwright, demo mode)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadtracker
          POSTGRES_PASSWORD: leadtracker
          POSTGRES_DB: leadtracker_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadtracker" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://leadtracker:leadtracker@localhost:5432/leadtracker_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cd apps/api && uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @leadtracker/web exec playwright install --with-deps chromium
      - run: pnpm --filter @leadtracker/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
