[project]
name = "leadtracker-api"
version = "1.0.0"
description = "Local business lead prospecting API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "phonenumbers>=8.13",
  "selectolax>=0.3.21",
  "structlog>=24.1",
  "rapidfuzz>=3.9",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
  "S101",   # assert in tests
  "S311",   # random for jitter is fine
  "B008",   # FastAPI Depends in defaults
  "RUF012",
  "RUF001", # Bulgarian (Cyrillic) strings are intentional
  "RUF002",
  "RUF003",
  "E501",   # line length is handled by `ruff format`; long literals are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "rapidfuzz.*", "phonenumbers.*", "itsdangerous.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
